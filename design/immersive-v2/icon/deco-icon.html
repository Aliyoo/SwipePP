<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>摩登画报 · APP 图标</title>
<style>
  /* 摩登画报图标：墨绿纸地 + 金双线画框 + 朱红方章「年」（美术字错位影） */
  body { margin: 0; padding: 24px; background: transparent; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  svg { display: block; }
  .cap { color: #EFE3C8; font: 14px/1.4 'Songti SC', serif; }
</style>
</head>
<body>

<!-- ① legacy 全幅（圆角方，预 API 26 回退） -->
<svg id="legacy" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17352F"/>
      <stop offset="1" stop-color="#143029"/>
    </linearGradient>
    <clipPath id="sq"><rect x="0" y="0" width="512" height="512" rx="104"/></clipPath>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#ground)"/>
    <!-- 金双线画框 -->
    <rect x="46" y="46" width="420" height="420" rx="40" fill="none" stroke="#C9A24A" stroke-width="10"/>
    <rect x="66" y="66" width="380" height="380" rx="28" fill="none" stroke="#C9A24A" stroke-opacity="0.55" stroke-width="4"/>
    <!-- 朱红方章 + 错位影 -->
    <rect x="156" y="156" width="216" height="216" rx="16" fill="#0B1D18" fill-opacity="0.45"/>
    <rect x="148" y="148" width="216" height="216" rx="16" fill="#9E2A1D"/>
    <rect x="162" y="162" width="188" height="188" rx="10" fill="none" stroke="#EFE3C8" stroke-opacity="0.28" stroke-width="2.5"/>
    <!-- 美术字「年」 -->
    <text x="256" y="266" text-anchor="middle" dominant-baseline="middle"
          font-family="Songti SC, STSong, serif" font-weight="900" font-size="136"
          fill="#EFE3C8">年</text>
  </g>
</svg>

<!-- ② legacy 圆形回退 -->
<svg id="round" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#ground)"/>
    <rect x="84" y="84" width="344" height="344" rx="36" fill="none" stroke="#C9A24A" stroke-width="9"/>
    <rect x="100" y="100" width="312" height="312" rx="26" fill="none" stroke="#C9A24A" stroke-opacity="0.55" stroke-width="3.5"/>
    <rect x="162" y="162" width="204" height="204" rx="15" fill="#0B1D18" fill-opacity="0.45"/>
    <rect x="154" y="154" width="204" height="204" rx="15" fill="#9E2A1D"/>
    <rect x="167" y="167" width="178" height="178" rx="9" fill="none" stroke="#EFE3C8" stroke-opacity="0.28" stroke-width="2.4"/>
    <text x="256" y="266" text-anchor="middle" dominant-baseline="middle"
          font-family="Songti SC, STSong, serif" font-weight="900" font-size="128"
          fill="#EFE3C8">年</text>
  </g>
</svg>

<!-- ③ adaptive 前景层（108dp 画布，内容居安全区 66dp 圆内） -->
<svg id="fg" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 金双线画框（缩进安全区） -->
  <rect x="106" y="106" width="300" height="300" rx="28" fill="none" stroke="#C9A24A" stroke-width="7"/>
  <rect x="120" y="120" width="272" height="272" rx="20" fill="none" stroke="#C9A24A" stroke-opacity="0.55" stroke-width="3"/>
  <!-- 朱红方章 + 错位影 -->
  <rect x="185" y="185" width="156" height="156" rx="12" fill="#0B1D18" fill-opacity="0.45"/>
  <rect x="178" y="178" width="156" height="156" rx="12" fill="#9E2A1D"/>
  <rect x="188" y="188" width="136" height="136" rx="8" fill="none" stroke="#EFE3C8" stroke-opacity="0.28" stroke-width="2"/>
  <text x="256" y="263" text-anchor="middle" dominant-baseline="middle"
        font-family="Songti SC, STSong, serif" font-weight="900" font-size="96"
        fill="#EFE3C8">年</text>
</svg>

<div class="cap">① legacy 圆角方 512 · ② legacy 圆 512 · ③ adaptive 前景（背景另由 vector 渐变承担）</div>
</body>
</html>
